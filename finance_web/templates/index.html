<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый отчёт</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="welcome-page">

<div class="welcome-container">
  <div class="welcome-card">
    <div class="welcome-logo">
      <i class="bi bi-bar-chart-fill"></i>
    </div>
    <h1 class="welcome-title">Финансовый отчёт</h1>
    <p class="welcome-sub">Производство и расходы предприятия</p>

    {% if periods %}
    <div class="periods-list">
      <div class="periods-label">Выберите период</div>
      {% for p in periods %}
      <a href="/period/{{ p }}" class="period-item">
        <i class="bi bi-folder2-open"></i>
        <span>{{ p }}</span>
        <i class="bi bi-chevron-right ms-auto"></i>
      </a>
      {% endfor %}
    </div>
    {% endif %}

    <button class="btn-new-period" data-bs-toggle="modal" data-bs-target="#newPeriodModal">
      <i class="bi bi-plus-circle"></i>
      Создать новый период
    </button>
  </div>
</div>

<!-- Модал: новый период -->
<div class="modal fade" id="newPeriodModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Новый период</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted small">Название периода</label>
          <input type="text" id="newPeriod" class="form-control form-control-lg"
                 placeholder="Например: Январь 2025">
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small">Название предприятия</label>
          <input type="text" id="newCompany" class="form-control"
                 placeholder="Например: ООО Рога и Копыта">
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-primary w-100 btn-lg" onclick="createPeriod()">
          <i class="bi bi-check2-circle"></i> Создать
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-white border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
async function createPeriod() {
  const period = document.getElementById('newPeriod').value.trim();
  const company = document.getElementById('newCompany').value.trim();
  if (!period) { showToast('Введите название периода', 'danger'); return; }
  const r = await fetch('/api/periods', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({period, company})
  });
  const d = await r.json();
  if (d.ok) window.location = '/period/' + encodeURIComponent(d.period);
  else showToast(d.error, 'danger');
}
document.getElementById('newPeriod')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') createPeriod();
});
</script>
</body>
</html>
